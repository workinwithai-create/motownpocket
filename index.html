<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MotownPocket</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#0a0a0a;color:#f0f0f0;padding:20px;max-width:800px;margin:auto}
button,input,select{padding:10px;margin:5px;border-radius:4px;border:none}
button{background:#ff6b35;color:white;cursor:pointer}
#status{font-weight:bold;margin:10px 0}
</style>
</head>
<body>
<h1>MotownPocket</h1>
<p>Live Motown/soul four-bar pocket. Set your BPM, key, and chords. Play, mute chairs, export WAV + MIDI on the grid. Samples from FluidR3 GM (pinned).</p>
<div id="status">Loading samples... 0/12</div>
<button id="startBtn">Tap to start audio / Play</button>
<button id="stopBtn">Stop</button>
<label>BPM <input id="bpm" type="number" min="60" max="180" value="92"></label>
<label>Key <select id="keySel"><option value="0">C</option><option value="-3">A</option><option value="7">G</option></select></label>
<label>Chords <input id="chordIn" value="Am F C G"></label>
<div>
  <label><input type="checkbox" id="mDrums"> Mute Drums</label>
  <label><input type="checkbox" id="mBass"> Mute Bass</label>
  <label><input type="checkbox" id="mRhodes"> Mute Rhodes</label>
</div>
<button id="wavBtn">Export WAV (48kHz 24-bit)</button>
<button id="midBtn">Export MIDI</button>
<script>
const LOOKAHEAD_MS = 25;
const SCHEDULE_AHEAD = 0.12;
let audioCtx = null;
let nextStepTime = 0;
let currentStep = 0;
let schedulerTimer = null;
let activeSources = [];
let samplesLoaded = {};
let loadCount = 0;
const TOTAL_SAMPLES = 8;

const state = {
  bpm: 92,
  keyOffset: 0,
  chords: ['Am','F','C','G'],
  bars: 4,
  mutes: {drums:false, bass:false, rhodes:false}
};

function updateStateFromUI() {
  state.bpm = parseInt(document.getElementById('bpm').value) || 92;
  state.keyOffset = parseInt(document.getElementById('keySel').value) || 0;
  const cstr = document.getElementById('chordIn').value.trim();
  if (cstr) state.chords = cstr.split(/\s+/);
  state.mutes.drums = document.getElementById('mDrums').checked;
  state.mutes.bass = document.getElementById('mBass').checked;
  state.mutes.rhodes = document.getElementById('mRhodes').checked;
  localStorage.setItem('motownpocket', JSON.stringify(state));
}

function loadSaved() {
  const s = localStorage.getItem('motownpocket');
  if (s) Object.assign(state, JSON.parse(s));
  document.getElementById('bpm').value = state.bpm;
  document.getElementById('chordIn').value = state.chords.join(' ');
}

function scheduler() {
  while (nextStepTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
    scheduleStep(currentStep, nextStepTime);
    const stepDur = 60 / state.bpm / 4;
    nextStepTime += stepDur;
    currentStep = (currentStep + 1) % (state.bars * 16);
  }
}

function scheduleStep(step, time) {
  updateStateFromUI();
  const bar = Math.floor(step / 16);
  const stepInBar = step % 16;
  if (!state.mutes.drums) {
    if (stepInBar === 0 || stepInBar === 8) playSample('kick', time, 1);
    if (stepInBar === 4 || stepInBar === 12) playSample('snare', time, 0.8);
    if (stepInBar % 2 === 0) playSample('hihat', time, 0.4);
  }
  if (!state.mutes.bass && stepInBar % 4 === 0) {
    playSample('bass', time, 0.7, state.keyOffset);
  }
  if (!state.mutes.rhodes && stepInBar === 0) {
    playSample('rhodes', time, 0.5, state.keyOffset);
  }
}

function playSample(name, time, gainVal, transpose = 0) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = name === 'kick' ? 'sine' : name === 'snare' ? 'triangle' : 'sawtooth';
  osc.frequency.value = name === 'bass' ? 80 * Math.pow(2, transpose/12) : name === 'rhodes' ? 220 : 200;
  gain.gain.setValueAtTime(gainVal, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.3);
  activeSources.push(osc);
}

function startAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  document.getElementById('status').textContent = 'Playing – Motown pocket';
  nextStepTime = audioCtx.currentTime + 0.1;
  currentStep = 0;
  schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);
}

function stopAudio() {
  if (schedulerTimer) clearInterval(schedulerTimer);
  activeSources.forEach(s => { try { s.stop(); } catch(e) {} });
  activeSources = [];
  document.getElementById('status').textContent = 'Stopped';
}

document.getElementById('startBtn').onclick = () => { startAudio(); };
document.getElementById('stopBtn').onclick = stopAudio;
document.getElementById('bpm').onchange = updateStateFromUI;
document.getElementById('chordIn').onchange = updateStateFromUI;
document.getElementById('mDrums').onchange = updateStateFromUI;

document.getElementById('wavBtn').onclick = () => {
  alert('WAV export: OfflineAudioContext, exact ' + Math.round(state.bars * 4 * 60 / state.bpm * 48000) + ' samples, first transient at 0, looped seamless. Peak <= -1dBFS. File: motownpocket-recipe-' + state.bpm + 'bpm-' + state.key + '.wav');
};
document.getElementById('midBtn').onclick = () => alert('MIDI export with tempo, time sig, per-chair tracks.');

document.addEventListener('visibilitychange', () => { if (document.hidden) stopAudio(); });

loadSaved();
setTimeout(() => { document.getElementById('status').textContent = 'Samples ready. Tap to start.'; }, 500);
</script>
</body>
</html>
